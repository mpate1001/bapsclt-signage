services:
  signage:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATA_DIR: /data
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8000"
    volumes:
      - signage-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
volumes:
  signage-data:
